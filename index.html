<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRYPT.</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crypt">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/000000/ffffff?text=C">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0a0a0a',
              card: '#121212',
              border: '#262626',
              light: '#f5f5f5',
              muted: '#888888'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Courier New', 'monospace'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Wavesurfer.js -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <!-- LocalForage (IndexedDB Wrapper) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <!-- Cropper.js per Crop/Rotazione immagini -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    body {
      background-color: #0a0a0a;
      color: #f5f5f5;
      user-select: none;
      -webkit-user-select: none;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 2px;
    }
    .cropper-view-box, .cropper-face {
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-sm pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-brand-black/80 backdrop-blur-md border-b border-brand-border px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3 cursor-pointer" id="btn-logo">
      <div class="w-8 h-8 bg-white text-black font-black font-mono flex items-center justify-center text-xl tracking-tighter">C</div>
      <h1 class="text-xl font-bold tracking-widest font-mono">CRYPT<span class="text-xs text-brand-muted font-normal ml-1">v1.3</span></h1>
    </div>

    <!-- Search & Quick Actions -->
    <div class="flex items-center gap-2">
      <div class="relative hidden sm:block">
        <input type="text" id="global-search" placeholder="Search BPM, Key, Genre..." 
               class="bg-brand-card border border-brand-border px-3 py-1.5 pl-8 text-xs rounded focus:outline-none focus:border-white w-48 font-mono">
        <span class="absolute left-2.5 top-2 text-brand-muted text-xs">🔍</span>
      </div>
      <button id="btn-export" title="Export Backup" class="p-2 bg-brand-card border border-brand-border rounded hover:bg-neutral-800 transition">💾</button>
      <button id="btn-import-trigger" title="Import Backup" class="p-2 bg-brand-card border border-brand-border rounded hover:bg-neutral-800 transition">📥</button>
      <input type="file" id="import-file-input" accept=".json" class="hidden">
      <button id="btn-open-create-collection" class="bg-white text-black px-3 py-1.5 font-semibold text-xs rounded hover:bg-neutral-200 transition font-mono">+ COLLECTION</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
    
    <!-- Navigation Breadcrumb -->
    <div id="breadcrumb" class="mb-6 hidden flex items-center gap-2 text-brand-muted text-xs font-mono">
      <span class="cursor-pointer hover:text-white transition" id="nav-home">CRYPT</span>
      <span>/</span>
      <span id="nav-current" class="text-white">...</span>
    </div>

    <!-- COLLECTIONS VIEW -->
    <section id="view-collections">
      <div class="flex justify-between items-end mb-4">
        <div>
          <h2 class="text-lg font-bold font-mono tracking-wider">YOUR CRYPT</h2>
          <p class="text-xs text-brand-muted">Select or create a vault to explore beats.</p>
        </div>
      </div>

      <div id="collections-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Rendered via JS -->
      </div>
    </section>

    <!-- SINGLE COLLECTION DETAIL VIEW -->
    <section id="view-collection-detail" class="hidden">
      <div id="collection-header-detail" class="mb-6 flex flex-col sm:flex-row gap-6 items-start sm:items-center bg-brand-card p-4 rounded border border-brand-border relative">
        <!-- Collection Detail Rendered via JS -->
      </div>

      <div class="flex justify-between items-center mb-4">
        <h3 class="font-mono text-xs text-brand-muted uppercase tracking-wider">Tracks</h3>
        <button id="btn-open-add-track" class="bg-white text-black px-3 py-1 text-xs font-mono font-bold rounded hover:bg-neutral-200 transition">+ ADD TRACK</button>
      </div>

      <!-- Tracks List -->
      <div id="tracks-list" class="space-y-2">
        <!-- Tracks Rendered via JS -->
      </div>
    </section>

  </main>

  <!-- PERSISTENT GLOBAL PLAYER -->
  <div id="global-player" class="fixed bottom-0 left-0 right-0 bg-brand-black/95 backdrop-blur-lg border-t border-brand-border z-40 p-3 hidden transition-all">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-3">
      <!-- Track Meta -->
      <div class="flex items-center gap-3 w-full md:w-1/4">
        <div id="player-cover" class="w-10 h-10 bg-brand-card border border-brand-border rounded flex-shrink-0 bg-cover bg-center"></div>
        <div class="truncate">
          <div id="player-title" class="font-bold text-xs truncate">No track selected</div>
          <div id="player-sub" class="text-[10px] text-brand-muted font-mono truncate">--</div>
        </div>
      </div>

      <!-- Waveform & Controls -->
      <div class="flex-1 w-full flex items-center gap-3">
        <button id="player-play-btn" class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0">▶</button>
        <div class="flex-1 relative">
          <div id="waveform" class="w-full"></div>
        </div>
        <span id="player-time" class="font-mono text-[10px] text-brand-muted flex-shrink-0">00:00</span>
      </div>
    </div>
  </div>

  <!-- MODAL: CREATE / EDIT COLLECTION -->
  <div id="modal-collection" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-brand-card border border-brand-border p-5 rounded w-full max-w-md space-y-4">
      <h3 id="modal-collection-title" class="font-mono font-bold text-sm tracking-wide">NEW COLLECTION</h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-[10px] text-brand-muted font-mono block mb-1">TITLE</label>
          <input type="text" id="col-title-input" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded focus:outline-none focus:border-white">
        </div>
        <div>
          <label class="text-[10px] text-brand-muted font-mono block mb-1">DESCRIPTION</label>
          <textarea id="col-desc-input" rows="2" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded focus:outline-none focus:border-white"></textarea>
        </div>
        <div>
          <label class="text-[10px] text-brand-muted font-mono block mb-1">COVER IMAGE</label>
          <div class="flex items-center gap-3">
            <div id="col-cover-preview" class="w-12 h-12 bg-brand-black border border-brand-border rounded bg-cover bg-center flex-shrink-0"></div>
            <!-- Input file visibile e nativo per massima compatibilità touch/mobile -->
            <input type="file" id="col-cover-file" accept="image/*" class="w-full text-xs text-brand-muted file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-mono file:bg-brand-border file:text-white hover:file:bg-neutral-700">
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-cancel-col" class="px-3 py-1.5 text-xs text-brand-muted font-mono hover:text-white">CANCEL</button>
        <button id="btn-save-col" class="bg-white text-black px-4 py-1.5 text-xs font-mono font-bold rounded">SAVE</button>
      </div>
    </div>
  </div>

  <!-- MODAL: CROP IMAGE -->
  <div id="modal-crop" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[60] flex items-center justify-center p-4 hidden">
    <div class="bg-brand-card border border-brand-border p-4 rounded w-full max-w-lg space-y-3">
      <h3 class="font-mono font-bold text-xs tracking-wide">ADJUST COVER IMAGE</h3>
      
      <div class="max-h-[50vh] overflow-hidden bg-black flex items-center justify-center rounded">
        <img id="crop-image-target" src="" class="max-w-full">
      </div>

      <!-- Controllo Rotazione -->
      <div class="flex justify-between items-center pt-2">
        <div class="flex gap-2">
          <button id="btn-rotate-left" class="bg-brand-border px-3 py-1 text-xs font-mono rounded">↺ 90°</button>
          <button id="btn-rotate-right" class="bg-brand-border px-3 py-1 text-xs font-mono rounded">↻ 90°</button>
        </div>
        <div class="flex gap-2">
          <button id="btn-cancel-crop" class="px-3 py-1 text-xs text-brand-muted font-mono">CANCEL</button>
          <button id="btn-apply-crop" class="bg-white text-black px-4 py-1.5 text-xs font-mono font-bold rounded">APPLY</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD TRACK -->
  <div id="modal-track" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-brand-card border border-brand-border p-5 rounded w-full max-w-md space-y-4">
      <h3 class="font-mono font-bold text-sm tracking-wide">ADD TRACK</h3>
      
      <div class="space-y-3">
        <div>
          <label class="text-[10px] text-brand-muted font-mono block mb-1">AUDIO FILE (MP3, WAV, etc)</label>
          <input type="file" id="track-audio-file" accept="audio/*" class="w-full bg-brand-black border border-brand-border p-1.5 text-xs rounded text-brand-muted">
        </div>
        <div>
          <label class="text-[10px] text-brand-muted font-mono block mb-1">TITLE</label>
          <input type="text" id="track-title-input" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded focus:outline-none focus:border-white">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[10px] text-brand-muted font-mono block mb-1">BPM</label>
            <input type="text" id="track-bpm-input" placeholder="140" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded font-mono focus:outline-none focus:border-white">
          </div>
          <div>
            <label class="text-[10px] text-brand-muted font-mono block mb-1">KEY</label>
            <input type="text" id="track-key-input" placeholder="C min" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded font-mono focus:outline-none focus:border-white">
          </div>
          <div>
            <label class="text-[10px] text-brand-muted font-mono block mb-1">GENRE</label>
            <input type="text" id="track-genre-input" placeholder="Trap" class="w-full bg-brand-black border border-brand-border p-2 text-xs rounded font-mono focus:outline-none focus:border-white">
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-cancel-track" class="px-3 py-1.5 text-xs text-brand-muted font-mono hover:text-white">CANCEL</button>
        <button id="btn-save-track" class="bg-white text-black px-4 py-1.5 text-xs font-mono font-bold rounded">UPLOAD</button>
      </div>
    </div>
  </div>

  <script>
    // APP STATE & INITIALIZATION
    const app = {
      data: {
        collections: [],
        tracks: []
      },
      currentCollectionId: null,
      currentTrack: null,
      wavesurfer: null,
      cropper: null,
      tempCroppedImageBase64: null,
      editingCollectionId: null,

      async init() {
        // LocalForage Config
        localforage.config({ name: 'CRYPT_STORAGE', storeName: 'crypt_data' });

        // Load data from IndexedDB
        const savedData = await localforage.getItem('crypt_app_data');
        if (savedData) {
          this.data = savedData;
        }

        this.initWaveSurfer();
        this.bindEvents();
        this.render();
      },

      initWaveSurfer() {
        this.wavesurfer = WaveSurfer.create({
          container: '#waveform',
          waveColor: '#404040',
          progressColor: '#ffffff',
          cursorColor: '#ffffff',
          barWidth: 2,
          barGap: 1,
          height: 32,
          responsive: true
        });

        this.wavesurfer.on('finish', () => {
          document.getElementById('player-play-btn').innerText = '▶';
        });

        this.wavesurfer.on('audioprocess', () => {
          const currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
          document.getElementById('player-time').innerText = currentTime;
        });
      },

      bindEvents() {
        // Navigation
        document.getElementById('btn-logo').onclick = () => this.goHome();
        document.getElementById('nav-home').onclick = () => this.goHome();

        // Modals Collection
        document.getElementById('btn-open-create-collection').onclick = () => this.openCollectionModal();
        document.getElementById('btn-cancel-col').onclick = () => this.closeCollectionModal();
        document.getElementById('btn-save-col').onclick = () => this.saveCollection();

        // Cover Input Direct Event (Senza label intermedie)
        const coverInput = document.getElementById('col-cover-file');
        coverInput.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              this.openCropModal(event.target.result);
            };
            reader.readAsDataURL(file);
          }
        };

        // Cropper Actions
        document.getElementById('btn-rotate-left').onclick = () => this.cropper && this.cropper.rotate(-90);
        document.getElementById('btn-rotate-right').onclick = () => this.cropper && this.cropper.rotate(90);
        document.getElementById('btn-cancel-crop').onclick = () => this.closeCropModal();
        document.getElementById('btn-apply-crop').onclick = () => {
          if (this.cropper) {
            const canvas = this.cropper.getCroppedCanvas({ width: 500, height: 500 });
            this.tempCroppedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('col-cover-preview').style.backgroundImage = `url(${this.tempCroppedImageBase64})`;
            this.closeCropModal();
          }
        };

        // Modals Track
        document.getElementById('btn-open-add-track').onclick = () => this.openTrackModal();
        document.getElementById('btn-cancel-track').onclick = () => this.closeTrackModal();
        document.getElementById('btn-save-track').onclick = () => this.saveTrack();

        // Player Controls
        document.getElementById('player-play-btn').onclick = () => {
          if (this.wavesurfer) {
            this.wavesurfer.playPause();
            document.getElementById('player-play-btn').innerText = this.wavesurfer.isPlaying() ? '⏸' : '▶';
          }
        };

        // Backup Export / Import
        document.getElementById('btn-export').onclick = () => this.exportBackup();
        document.getElementById('btn-import-trigger').onclick = () => document.getElementById('import-file-input').click();
        document.getElementById('import-file-input').onchange = (e) => this.importBackup(e);

        // Search
        document.getElementById('global-search').oninput = (e) => this.handleSearch(e.target.value);
      },

      openCropModal(imageSrc) {
        const cropImg = document.getElementById('crop-image-target');
        cropImg.src = imageSrc;
        document.getElementById('modal-crop').classList.remove('hidden');

        if (this.cropper) this.cropper.destroy();
        this.cropper = new Cropper(cropImg, {
          aspectRatio: 1,
          viewMode: 1,
          background: false
        });
      },

      closeCropModal() {
        document.getElementById('modal-crop').classList.add('hidden');
        if (this.cropper) {
          this.cropper.destroy();
          this.cropper = null;
        }
      },

      async persistData() {
        await localforage.setItem('crypt_app_data', this.data);
      },

      goHome() {
        this.currentCollectionId = null;
        document.getElementById('view-collection-detail').classList.add('hidden');
        document.getElementById('view-collections').classList.remove('hidden');
        document.getElementById('breadcrumb').classList.add('hidden');
        this.render();
      },

      openCollectionModal(id = null) {
        this.editingCollectionId = id;
        this.tempCroppedImageBase64 = null;
        const modal = document.getElementById('modal-collection');
        const titleEl = document.getElementById('modal-collection-title');
        
        if (id) {
          titleEl.innerText = 'EDIT COLLECTION';
          const col = this.data.collections.find(c => c.id === id);
          document.getElementById('col-title-input').value = col.title;
          document.getElementById('col-desc-input').value = col.desc || '';
          document.getElementById('col-cover-preview').style.backgroundImage = col.cover ? `url(${col.cover})` : 'none';
          this.tempCroppedImageBase64 = col.cover;
        } else {
          titleEl.innerText = 'NEW COLLECTION';
          document.getElementById('col-title-input').value = '';
          document.getElementById('col-desc-input').value = '';
          document.getElementById('col-cover-preview').style.backgroundImage = 'none';
        }
        modal.classList.remove('hidden');
      },

      closeCollectionModal() {
        document.getElementById('modal-collection').classList.add('hidden');
        document.getElementById('col-cover-file').value = '';
      },

      async saveCollection() {
        const title = document.getElementById('col-title-input').value.trim();
        const desc = document.getElementById('col-desc-input').value.trim();

        if (!title) return alert('Title is required');

        if (this.editingCollectionId) {
          const col = this.data.collections.find(c => c.id === this.editingCollectionId);
          col.title = title;
          col.desc = desc;
          if (this.tempCroppedImageBase64) col.cover = this.tempCroppedImageBase64;
        } else {
          const newCol = {
            id: 'col_' + Date.now(),
            title,
            desc,
            cover: this.tempCroppedImageBase64 || null
          };
          this.data.collections.push(newCol);
        }

        await this.persistData();
        this.closeCollectionModal();
        this.render();
      },

      async deleteCollection(id) {
        if (!confirm("Are you sure? All tracks inside will be deleted.")) return;
        this.data.collections = this.data.collections.filter(c => c.id !== id);
        this.data.tracks = this.data.tracks.filter(t => t.collectionId !== id);
        await this.persistData();
        this.goHome();
      },

      openTrackModal() {
        document.getElementById('track-title-input').value = '';
        document.getElementById('track-bpm-input').value = '';
        document.getElementById('track-key-input').value = '';
        document.getElementById('track-genre-input').value = '';
        document.getElementById('track-audio-file').value = '';
        document.getElementById('modal-track').classList.remove('hidden');
      },

      closeTrackModal() {
        document.getElementById('modal-track').classList.add('hidden');
      },

      async saveTrack() {
        const fileInput = document.getElementById('track-audio-file');
        const title = document.getElementById('track-title-input').value.trim();
        const bpm = document.getElementById('track-bpm-input').value.trim();
        const key = document.getElementById('track-key-input').value.trim();
        const genre = document.getElementById('track-genre-input').value.trim();

        if (!fileInput.files[0]) return alert('Select an audio file');

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (e) => {
          const newTrack = {
            id: 'track_' + Date.now(),
            collectionId: this.currentCollectionId,
            title: title || file.name.replace(/\.[^/.]+$/, ""),
            bpm: bpm || '---',
            key: key || '---',
            genre: genre || '---',
            audioData: e.target.result
          };

          this.data.tracks.push(newTrack);
          await this.persistData();
          this.closeTrackModal();
          this.renderCollectionDetail(this.currentCollectionId);
        };

        reader.readAsDataURL(file);
      },

      async deleteTrack(id) {
        if (!confirm("Delete this track?")) return;
        this.data.tracks = this.data.tracks.filter(t => t.id !== id);
        await this.persistData();
        this.renderCollectionDetail(this.currentCollectionId);
      },

      playTrack(track) {
        this.currentTrack = track;
        const player = document.getElementById('global-player');
        player.classList.remove('hidden');

        document.getElementById('player-title').innerText = track.title;
        document.getElementById('player-sub').innerText = `${track.bpm} BPM | ${track.key} | ${track.genre}`;

        const parentCol = this.data.collections.find(c => c.id === track.collectionId);
        const coverEl = document.getElementById('player-cover');
        if (parentCol && parentCol.cover) {
          coverEl.style.backgroundImage = `url(${parentCol.cover})`;
        } else {
          coverEl.style.backgroundImage = 'none';
        }

        this.wavesurfer.load(track.audioData);
        this.wavesurfer.on('ready', () => {
          this.wavesurfer.play();
          document.getElementById('player-play-btn').innerText = '⏸';
        });
      },

      render() {
        if (this.currentCollectionId) {
          this.renderCollectionDetail(this.currentCollectionId);
        } else {
          this.renderCollectionsGrid();
        }
      },

      renderCollectionsGrid() {
        const grid = document.getElementById('collections-grid');
        grid.innerHTML = '';

        if (this.data.collections.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-brand-muted font-mono text-xs">No collections created yet. Click "+ COLLECTION" to start.</div>`;
          return;
        }

        this.data.collections.forEach(col => {
          const trackCount = this.data.tracks.filter(t => t.collectionId === col.id).length;
          const card = document.createElement('div');
          card.className = 'bg-brand-card border border-brand-border rounded p-3 cursor-pointer hover:border-white transition flex flex-col justify-between group relative';
          
          card.innerHTML = `
            <div>
              <div class="aspect-square bg-brand-black border border-brand-border rounded mb-3 bg-cover bg-center" 
                   style="background-image: ${col.cover ? `url(${col.cover})` : 'none'}">
              </div>
              <h3 class="font-bold text-xs truncate group-hover:text-white font-mono">${col.title}</h3>
              <p class="text-[10px] text-brand-muted truncate mt-0.5">${col.desc || 'No description'}</p>
            </div>
            <div class="mt-3 flex justify-between items-center text-[10px] text-brand-muted font-mono">
              <span>${trackCount} tracks</span>
              <button class="btn-edit-col hover:text-white" data-id="${col.id}">✎ Edit</button>
            </div>
          `;

          card.onclick = (e) => {
            if (e.target.classList.contains('btn-edit-col')) {
              e.stopPropagation();
              this.openCollectionModal(col.id);
            } else {
              this.openCollectionDetail(col.id);
            }
          };

          grid.appendChild(card);
        });
      },

      openCollectionDetail(id) {
        this.currentCollectionId = id;
        document.getElementById('view-collections').classList.add('hidden');
        document.getElementById('view-collection-detail').classList.remove('hidden');
        document.getElementById('breadcrumb').classList.remove('hidden');

        this.renderCollectionDetail(id);
      },

      renderCollectionDetail(id) {
        const col = this.data.collections.find(c => c.id === id);
        if (!col) return this.goHome();

        document.getElementById('nav-current').innerText = col.title;

        // Render Header
        const headerEl = document.getElementById('collection-header-detail');
        headerEl.innerHTML = `
          <div class="w-24 h-24 sm:w-32 sm:h-32 bg-brand-black border border-brand-border rounded bg-cover bg-center flex-shrink-0" 
               style="background-image: ${col.cover ? `url(${col.cover})` : 'none'}"></div>
          <div class="flex-1">
            <h2 class="text-xl font-bold font-mono tracking-wide">${col.title}</h2>
            <p class="text-xs text-brand-muted mt-1">${col.desc || 'No description'}</p>
          </div>
          <button id="btn-delete-col" class="absolute top-3 right-3 text-brand-muted hover:text-red-500 font-mono text-xs">🗑 Delete Vault</button>
        `;

        document.getElementById('btn-delete-col').onclick = () => this.deleteCollection(col.id);

        // Render Tracks
        const listEl = document.getElementById('tracks-list');
        listEl.innerHTML = '';

        const tracks = this.data.tracks.filter(t => t.collectionId === id);

        if (tracks.length === 0) {
          listEl.innerHTML = `<div class="text-center py-8 text-brand-muted font-mono text-xs">Vault is empty. Add a track to populate it.</div>`;
          return;
        }

        tracks.forEach(t => {
          const item = document.createElement('div');
          item.className = 'bg-brand-card border border-brand-border p-3 rounded flex items-center justify-between hover:border-neutral-600 transition group';
          item.innerHTML = `
            <div class="flex items-center gap-3">
              <button class="btn-play-track w-7 h-7 bg-white text-black rounded-full flex items-center justify-center font-bold text-xs" data-id="${t.id}">▶</button>
              <div>
                <div class="font-bold text-xs">${t.title}</div>
                <div class="text-[10px] text-brand-muted font-mono">${t.genre}</div>
              </div>
            </div>

            <div class="flex items-center gap-4">
              <div class="flex gap-2 font-mono text-[10px]">
                <span class="bg-brand-black px-2 py-0.5 border border-brand-border rounded text-neutral-300">${t.bpm} BPM</span>
                <span class="bg-brand-black px-2 py-0.5 border border-brand-border rounded text-neutral-300">${t.key}</span>
              </div>
              <button class="btn-del-track text-brand-muted hover:text-red-500 font-mono text-xs opacity-0 group-hover:opacity-100 transition" data-id="${t.id}">✕</button>
            </div>
          `;

          item.querySelector('.btn-play-track').onclick = () => this.playTrack(t);
          item.querySelector('.btn-del-track').onclick = () => this.deleteTrack(t.id);

          listEl.appendChild(item);
        });
      },

      formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      },

      async exportBackup() {
        const jsonStr = JSON.stringify(this.data);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `crypt_backup_${Date.now()}.json`;
        a.click();
      },

      async importBackup(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const importedData = JSON.parse(evt.target.result);
            if (importedData.collections && importedData.tracks) {
              this.data = importedData;
              await this.persistData();
              alert('Backup imported successfully!');
              this.goHome();
            } else {
              alert('Invalid backup structure');
            }
          } catch (err) {
            alert('Failed to parse backup file');
          }
        };
        reader.readAsText(file);
      }
    };

    // Init App
    document.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato!', reg))
          .catch(err => console.log('Errore SW:', err));
      });
    }
  </script>
</body>
