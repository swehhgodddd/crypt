<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRYPT.</title>
  
  <!-- PWA Meta Tags -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crypt">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/000000/ffffff?text=C">

  <!-- External Libraries -->
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <style>
    :root { --fg:#fff; --mute:#8c8c8c; --line:rgba(255,255,255,.14); --line-hi:rgba(255,255,255,.55); --soft:rgba(255,255,255,.06); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    html { -webkit-font-smoothing: antialiased; }
    body { background: #000; color: var(--fg); font-size: 14px; padding-bottom: 120px; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    header { position: sticky; top: 0; z-index: 30; background: rgba(0,0,0,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo-box { cursor: pointer; }
    .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -.04em; }

    .btn-group { display: flex; gap: 6px; align-items: center; }
    .btn { background: transparent; border: 1px solid var(--line); color: var(--fg); padding: 8px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; cursor: pointer; transition: border-color .15s, background .15s; }
    .btn:hover { border-color: var(--line-hi); }
    .btn-white { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    .btn-white:hover { background: #d9d9d9; border-color: #d9d9d9; }
    .btn-delete { position: absolute; top: 0; right: 0; color: var(--mute); }

    main { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .section-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .display { font-size: clamp(44px, 10vw, 96px); font-weight: 700; letter-spacing: -.055em; line-height: .95; margin-bottom: 16px; }
    .section-sub { font-size: 14px; color: var(--mute); margin-bottom: 44px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 32px 20px; }
    .card { cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; }
    .card-cover { aspect-ratio: 1; background-color: var(--soft); border-radius: 4px; margin-bottom: 12px; background-size: cover; background-position: center; filter: grayscale(1) contrast(1.05); transition: filter .4s; }
    .card:hover .card-cover { filter: none; }
    .card-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .card-footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); margin-top: 10px; }

    .detail-head { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 40px; position: relative; }
    .detail-cover { width: 160px; height: 160px; border-radius: 4px; background-color: var(--soft); background-size: cover; background-position: center; flex-shrink: 0; filter: grayscale(1); }
    .detail-title { font-size: clamp(30px, 6vw, 60px); font-weight: 700; letter-spacing: -.045em; line-height: 1; }
    .detail-desc { font-size: 14px; color: var(--mute); margin-top: 10px; }

    .track-row { padding: 14px 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; transition: background .15s; }
    .track-row:first-child { border-top: 1px solid var(--line); }
    .track-row:hover { background: rgba(255,255,255,.04); }
    .track-meta { display: flex; align-items: center; gap: 14px; }
    .btn-play { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #000; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tag { border: 1px solid var(--line); padding: 3px 10px; font-size: 11px; color: #bdbdbd; border-radius: 999px; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.hidden { display: none !important; }
    .modal-box { background: #000; border: 1px solid var(--line); padding: 24px; border-radius: 14px; width: 100%; max-width: 420px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 16px; }

    .input-field { width: 100%; background: transparent; border: 1px solid var(--line); color: #fff; padding: 11px 12px; border-radius: 8px; font-size: 16px; outline: none; transition: border-color .15s; }
    .input-field:focus { border-color: #fff; }
    .input-file-native { width: 100%; color: var(--mute); font-size: 13px; cursor: pointer; }
    .input-file-native::file-selector-button { background: transparent; border: 1px solid var(--line); color: #fff; padding: 8px 14px; border-radius: 999px; margin-right: 12px; font-family: inherit; font-size: 12px; cursor: pointer; }
    .label { font-size: 12px; color: var(--mute); margin-bottom: 6px; display: block; }

    /* Cropper in bianco e nero */
    .cropper-view-box { outline-color: rgba(255,255,255,.9); }
    .cropper-line, .cropper-point { background-color: #fff; }
    .cropper-modal { background-color: #000; }

    /* Player */
    #global-player { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.86); border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    #global-player.hidden { display: none !important; }
    .player-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 16px; align-items: center; }
    .player-cover { width: 44px; height: 44px; border-radius: 4px; background-color: var(--soft); background-size: cover; background-position: center; flex-shrink: 0; filter: grayscale(1); }
    #waveform { flex: 1; min-width: 0; }

    @media (max-width: 520px) {
      header { padding: 12px 14px; }
      .btn { padding: 8px 11px; }
      main { padding: 28px 14px; }
      .detail-cover { width: 104px; height: 104px; }
      .detail-head { gap: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <header>
    <div class="logo-box" id="btn-logo">
      <div class="logo-text">Crypt.</div>
    </div>
    <div class="btn-group">
      <button id="btn-export" class="btn" title="Export Backup">Backup</button>
      <button id="btn-import-trigger" class="btn" title="Import Backup">Import</button>
      <input type="file" id="import-file-input" accept=".json" style="display:none">
      <button id="btn-open-create-collection" class="btn btn-white">New collection</button>
    </div>
  </header>

  <main>
    <div id="breadcrumb" style="display:none; margin-bottom: 28px; font-size: 13px; color: #8c8c8c;">
      <span id="nav-home" style="cursor:pointer;">Crypt</span> / <span id="nav-current" style="color:#fff;">...</span>
    </div>

    <!-- COLLECTIONS VIEW -->
    <section id="view-collections">
      <div class="section-title display">Your crypt</div>
      <div class="section-sub">Open a collection or create a new one.</div>
      <div id="collections-grid" class="grid"></div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="view-collection-detail" style="display:none;">
      <div id="collection-header-detail" class="detail-head"></div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div class="section-title">Tracks</div>
        <button id="btn-open-add-track" class="btn btn-white">Add track</button>
      </div>
      <div id="tracks-list"></div>
    </section>
  </main>

  <!-- PLAYER -->
  <div id="global-player" class="hidden">
    <div class="player-container">
      <div id="player-cover" class="player-cover"></div>
      <div style="width:160px; overflow:hidden;">
        <div id="player-title" style="font-size:13px; font-weight:600; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">Track</div>
        <div id="player-sub" style="font-size:11px; color:#8c8c8c;">--</div>
      </div>
      <button id="player-play-btn" class="btn-play">▶</button>
      <div id="waveform"></div>
      <span id="player-time" style="font-size:12px; color:#8c8c8c;">00:00</span>
    </div>
  </div>

  <!-- MODAL COLLECTION -->
  <div id="modal-collection" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-collection-title" class="section-title">New collection</div>
      <div>
        <label class="label">Title</label>
        <input type="text" id="col-title-input" class="input-field" placeholder="e.g. Dark Trap 2026">
      </div>
      <div>
        <label class="label">Description</label>
        <textarea id="col-desc-input" class="input-field" rows="2" placeholder="Optional notes..."></textarea>
      </div>
      <div>
        <label class="label">Cover image</label>
        <div style="display:flex; gap:12px; align-items:center;">
          <div id="col-cover-preview" style="width:56px; height:56px; background:rgba(255,255,255,.06); border-radius:4px; filter:grayscale(1); background-size:cover; background-position:center; flex-shrink:0;"></div>
          <!-- Standard native file input for direct browser/mobile compatibility -->
          <input type="file" id="col-cover-file" class="input-file-native">
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button id="btn-cancel-col" class="btn">Cancel</button>
        <button id="btn-save-col" class="btn btn-white">Save</button>
      </div>
    </div>
  </div>

  <!-- MODAL CROP -->
  <div id="modal-crop" class="modal-overlay hidden" style="z-index:200;">
    <div class="modal-box" style="max-width:480px;">
      <div class="section-title">Adjust cover</div>
      <div style="max-height:280px; overflow:hidden; background:#000; border-radius:4px; display:flex; justify-content:center; align-items:center;">
        <img id="crop-image-target" src="" style="max-width:100%; display:block;">
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
        <div style="display:flex; gap:4px;">
          <button id="btn-rotate-left" class="btn">↺ 90°</button>
          <button id="btn-rotate-right" class="btn">↻ 90°</button>
        </div>
        <div style="display:flex; gap:4px;">
          <button id="btn-cancel-crop" class="btn">Cancel</button>
          <button id="btn-apply-crop" class="btn btn-white">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL TRACK -->
  <div id="modal-track" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="section-title">Add track</div>
      <div>
        <label class="label">Audio file (MP3, WAV)</label>
        <input type="file" id="track-audio-file" accept="audio/*" class="input-file-native">
      </div>
      <div>
        <label class="label">Title</label>
        <input type="text" id="track-title-input" class="input-field" placeholder="Track Title">
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
        <div>
          <label class="label">BPM</label>
          <input type="text" id="track-bpm-input" placeholder="140" class="input-field">
        </div>
        <div>
          <label class="label">Key</label>
          <input type="text" id="track-key-input" placeholder="C min" class="input-field">
        </div>
        <div>
          <label class="label">Genre</label>
          <input type="text" id="track-genre-input" placeholder="Trap" class="input-field">
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button id="btn-cancel-track" class="btn">Cancel</button>
        <button id="btn-save-track" class="btn btn-white">Upload</button>
      </div>
    </div>
  </div>

  <script>
    const app = {
      data: { collections: [], tracks: [] },
      currentCollectionId: null,
      wavesurfer: null,
      cropper: null,
      tempCroppedImageBase64: null,
      editingCollectionId: null,

      async init() {
        localforage.config({ name: 'CRYPT_STORAGE', storeName: 'crypt_data' });
        const savedData = await localforage.getItem('crypt_app_data');
        if (savedData) this.data = savedData;

        this.initWaveSurfer();
        this.bindEvents();
        this.render();
      },

      initWaveSurfer() {
        this.wavesurfer = WaveSurfer.create({
          container: '#waveform',
          waveColor: '#3a3a3a',
          progressColor: '#ffffff',
          cursorColor: '#ffffff',
          barWidth: 2,
          barGap: 1,
          height: 32,
          responsive: true
        });

        this.wavesurfer.on('finish', () => {
          document.getElementById('player-play-btn').innerText = '▶';
        });

        this.wavesurfer.on('audioprocess', () => {
          const currentTime = this.formatTime(this.wavesurfer.getCurrentTime());
          document.getElementById('player-time').innerText = currentTime;
        });
      },

      bindEvents() {
        document.getElementById('btn-logo').onclick = () => this.goHome();
        document.getElementById('nav-home').onclick = () => this.goHome();

        document.getElementById('btn-open-create-collection').onclick = () => this.openCollectionModal();
        document.getElementById('btn-cancel-col').onclick = () => this.closeCollectionModal();
        document.getElementById('btn-save-col').onclick = () => this.saveCollection();

        // File change listener (mobile-safe: ridimensiona l'immagine prima del crop)
        document.getElementById('col-cover-file').addEventListener('change', async (e) => {
          const input = e.target;
          const file = input.files && input.files[0];
          if (!file) return;
          if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|bmp)$/i.test(file.name)) {
            alert('Seleziona un file immagine (JPG, PNG, WEBP).');
            input.value = '';
            return;
          }
          try {
            const dataUrl = await this.prepareImage(file);
            this.openCropModal(dataUrl);
          } catch (err) {
            console.error('Cover load error:', err);
            alert('Impossibile leggere questa immagine. Prova con un JPG o PNG.');
          }
          input.value = '';
        });

        document.getElementById('btn-rotate-left').onclick = () => this.cropper && this.cropper.rotate(-90);
        document.getElementById('btn-rotate-right').onclick = () => this.cropper && this.cropper.rotate(90);
        document.getElementById('btn-cancel-crop').onclick = () => this.closeCropModal();
        document.getElementById('btn-apply-crop').onclick = () => {
          if (this.cropper) {
            const canvas = this.cropper.getCroppedCanvas({ width: 500, height: 500 });
            this.tempCroppedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('col-cover-preview').style.backgroundImage = `url(${this.tempCroppedImageBase64})`;
            this.closeCropModal();
          }
        };

        document.getElementById('btn-open-add-track').onclick = () => this.openTrackModal();
        document.getElementById('btn-cancel-track').onclick = () => this.closeTrackModal();
        document.getElementById('btn-save-track').onclick = () => this.saveTrack();

        document.getElementById('player-play-btn').onclick = () => {
          if (this.wavesurfer) {
            this.wavesurfer.playPause();
            document.getElementById('player-play-btn').innerText = this.wavesurfer.isPlaying() ? '⏸' : '▶';
          }
        };

        document.getElementById('btn-export').onclick = () => this.exportBackup();
        document.getElementById('btn-import-trigger').onclick = () => document.getElementById('import-file-input').click();
        document.getElementById('import-file-input').onchange = (e) => this.importBackup(e);
      },

      // Ridimensiona (max 1600px) e raddrizza l'EXIF: le foto da telefono sono enormi
      async prepareImage(file) {
        const MAX = 1600;
        let source, w, h;
        if (window.createImageBitmap) {
          try {
            source = await createImageBitmap(file, { imageOrientation: 'from-image' });
            w = source.width; h = source.height;
          } catch (_) { source = null; }
        }
        if (!source) {
          const url = URL.createObjectURL(file);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
          URL.revokeObjectURL(url);
          source = img; w = img.naturalWidth; h = img.naturalHeight;
        }
        const scale = Math.min(1, MAX / Math.max(w, h));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height);
        if (source.close) source.close();
        return canvas.toDataURL('image/jpeg', 0.9);
      },

      openCropModal(imageSrc) {
        const cropImg = document.getElementById('crop-image-target');
        if (this.cropper) { this.cropper.destroy(); this.cropper = null; }
        document.getElementById('modal-crop').classList.remove('hidden');
        // Cropper va creato SOLO dopo che l'immagine e' caricata
        cropImg.onload = () => {
          cropImg.onload = null;
          this.cropper = new Cropper(cropImg, {
            aspectRatio: 1, viewMode: 1, background: false,
            checkOrientation: false, autoCropArea: 1
          });
        };
        cropImg.src = imageSrc;
      },

      closeCropModal() {
        document.getElementById('modal-crop').classList.add('hidden');
        if (this.cropper) { this.cropper.destroy(); this.cropper = null; }
      },

      async persistData() {
        await localforage.setItem('crypt_app_data', this.data);
      },

      goHome() {
        this.currentCollectionId = null;
        document.getElementById('view-collection-detail').style.display = 'none';
        document.getElementById('view-collections').style.display = 'block';
        document.getElementById('breadcrumb').style.display = 'none';
        this.render();
      },

      openCollectionModal(id = null) {
        this.editingCollectionId = id;
        this.tempCroppedImageBase64 = null;
        const modal = document.getElementById('modal-collection');
        const titleEl = document.getElementById('modal-collection-title');
        
        if (id) {
          titleEl.innerText = 'Edit collection';
          const col = this.data.collections.find(c => c.id === id);
          document.getElementById('col-title-input').value = col.title;
          document.getElementById('col-desc-input').value = col.desc || '';
          document.getElementById('col-cover-preview').style.backgroundImage = col.cover ? `url(${col.cover})` : 'none';
          this.tempCroppedImageBase64 = col.cover;
        } else {
          titleEl.innerText = 'New collection';
          document.getElementById('col-title-input').value = '';
          document.getElementById('col-desc-input').value = '';
          document.getElementById('col-cover-preview').style.backgroundImage = 'none';
        }
        modal.classList.remove('hidden');
      },

      closeCollectionModal() {
        document.getElementById('modal-collection').classList.add('hidden');
        document.getElementById('col-cover-file').value = '';
      },

      async saveCollection() {
        const title = document.getElementById('col-title-input').value.trim();
        const desc = document.getElementById('col-desc-input').value.trim();
        if (!title) return alert('Title is required');

        if (this.editingCollectionId) {
          const col = this.data.collections.find(c => c.id === this.editingCollectionId);
          col.title = title;
          col.desc = desc;
          if (this.tempCroppedImageBase64) col.cover = this.tempCroppedImageBase64;
        } else {
          this.data.collections.push({
            id: 'col_' + Date.now(),
            title, desc,
            cover: this.tempCroppedImageBase64 || null
          });
        }

        await this.persistData();
        this.closeCollectionModal();
        this.render();
      },

      async deleteCollection(id) {
        if (!confirm("Are you sure? All tracks inside will be deleted.")) return;
        this.data.collections = this.data.collections.filter(c => c.id !== id);
        this.data.tracks = this.data.tracks.filter(t => t.collectionId !== id);
        await this.persistData();
        this.goHome();
      },

      openTrackModal() {
        document.getElementById('track-title-input').value = '';
        document.getElementById('track-bpm-input').value = '';
        document.getElementById('track-key-input').value = '';
        document.getElementById('track-genre-input').value = '';
        document.getElementById('track-audio-file').value = '';
        document.getElementById('modal-track').classList.remove('hidden');
      },

      closeTrackModal() {
        document.getElementById('modal-track').classList.add('hidden');
      },

      async saveTrack() {
        const fileInput = document.getElementById('track-audio-file');
        const title = document.getElementById('track-title-input').value.trim();
        const bpm = document.getElementById('track-bpm-input').value.trim();
        const key = document.getElementById('track-key-input').value.trim();
        const genre = document.getElementById('track-genre-input').value.trim();

        if (!fileInput.files[0]) return alert('Select an audio file');

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async (e) => {
          this.data.tracks.push({
            id: 'track_' + Date.now(),
            collectionId: this.currentCollectionId,
            title: title || file.name.replace(/\.[^/.]+$/, ""),
            bpm: bpm || '---',
            key: key || '---',
            genre: genre || '---',
            audioData: e.target.result
          });

          await this.persistData();
          this.closeTrackModal();
          this.renderCollectionDetail(this.currentCollectionId);
        };

        reader.readAsDataURL(file);
      },

      async deleteTrack(id) {
        if (!confirm("Delete track?")) return;
        this.data.tracks = this.data.tracks.filter(t => t.id !== id);
        await this.persistData();
        this.renderCollectionDetail(this.currentCollectionId);
      },

      playTrack(track) {
        document.getElementById('global-player').classList.remove('hidden');
        document.getElementById('player-title').innerText = track.title;
        document.getElementById('player-sub').innerText = `${track.bpm} BPM, ${track.key}, ${track.genre}`;

        const parentCol = this.data.collections.find(c => c.id === track.collectionId);
        const coverEl = document.getElementById('player-cover');
        coverEl.style.backgroundImage = (parentCol && parentCol.cover) ? `url(${parentCol.cover})` : 'none';

        this.wavesurfer.load(track.audioData);
        this.wavesurfer.on('ready', () => {
          this.wavesurfer.play();
          document.getElementById('player-play-btn').innerText = '⏸';
        });
      },

      render() {
        if (this.currentCollectionId) this.renderCollectionDetail(this.currentCollectionId);
        else this.renderCollectionsGrid();
      },

      renderCollectionsGrid() {
        const grid = document.getElementById('collections-grid');
        grid.innerHTML = '';

        if (this.data.collections.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 80px 0; color:#8c8c8c; font-size:14px;">No collections yet. Create one to get started.</div>`;
          return;
        }

        this.data.collections.forEach(col => {
          const trackCount = this.data.tracks.filter(t => t.collectionId === col.id).length;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="card-cover" style="background-image:${col.cover ? `url(${col.cover})` : 'none'}"></div>
              <div class="card-title">${col.title}</div>
              <div class="card-desc">${col.desc || 'No description'}</div>
            </div>
            <div class="card-footer">
              <span>${trackCount} tracks</span>
              <span class="btn-edit-col" data-id="${col.id}" style="cursor:pointer; color:#fff;">Edit</span>
            </div>
          `;

          card.onclick = (e) => {
            if (e.target.classList.contains('btn-edit-col')) {
              e.stopPropagation();
              this.openCollectionModal(col.id);
            } else {
              this.openCollectionDetail(col.id);
            }
          };

          grid.appendChild(card);
        });
      },

      openCollectionDetail(id) {
        this.currentCollectionId = id;
        document.getElementById('view-collections').style.display = 'none';
        document.getElementById('view-collection-detail').style.display = 'block';
        document.getElementById('breadcrumb').style.display = 'block';
        this.renderCollectionDetail(id);
      },

      renderCollectionDetail(id) {
        const col = this.data.collections.find(c => c.id === id);
        if (!col) return this.goHome();

        document.getElementById('nav-current').innerText = col.title;

        const headerEl = document.getElementById('collection-header-detail');
        headerEl.innerHTML = `
          <div class="detail-cover" style="background-image:${col.cover ? `url(${col.cover})` : 'none'}"></div>
          <div style="flex:1;">
            <div class="detail-title">${col.title}</div>
            <div class="detail-desc">${col.desc || 'No description'}</div>
          </div>
          <button id="btn-delete-col" class="btn btn-delete">Delete</button>
        `;

        document.getElementById('btn-delete-col').onclick = () => this.deleteCollection(col.id);

        const listEl = document.getElementById('tracks-list');
        listEl.innerHTML = '';

        const tracks = this.data.tracks.filter(t => t.collectionId === id);

        if (tracks.length === 0) {
          listEl.innerHTML = `<div style="text-align:center; padding:60px 0; color:#8c8c8c; font-size:14px;">No tracks yet. Add the first one.</div>`;
          return;
        }

        tracks.forEach(t => {
          const item = document.createElement('div');
          item.className = 'track-row';
          item.innerHTML = `
            <div class="track-meta">
              <button class="btn-play btn-play-track" data-id="${t.id}">▶</button>
              <div>
                <div style="font-size:14px; font-weight:600;">${t.title}</div>
                <div style="font-size:12px; color:#8c8c8c;">${t.genre}</div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
              <span class="tag">${t.bpm} BPM</span>
              <span class="tag">${t.key}</span>
              <button class="btn-del-track btn" style="color:#8c8c8c; border:none; padding:4px 8px;" data-id="${t.id}">✕</button>
            </div>
          `;

          item.querySelector('.btn-play-track').onclick = () => this.playTrack(t);
          item.querySelector('.btn-del-track').onclick = () => this.deleteTrack(t.id);

          listEl.appendChild(item);
        });
      },

      formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      },

      exportBackup() {
        const jsonStr = JSON.stringify(this.data);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `crypt_backup_${Date.now()}.json`;
        a.click();
      },

      importBackup(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const importedData = JSON.parse(evt.target.result);
            if (importedData.collections && importedData.tracks) {
              this.data = importedData;
              await this.persistData();
              alert('Backup imported successfully!');
              this.goHome();
            }
          } catch (err) { alert('Failed to parse backup file'); }
        };
        reader.readAsText(file);
      }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato!', reg))
          .catch(err => console.log('Errore SW:', err));
      });
    }
  </script>
</body>
</html>
